services:
  - type: web
    name: taskflow-pro-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-pro-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        sync: false
      - key: NODE_ENV
        value: production

  - type: web
    name: taskflow-pro-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false

databases:
  - name: taskflow-pro-db
    databaseName: taskflow
    user: taskflow
